# Z2Panel - zapret2 yönetim paneli (http://<router-ip>:__PORT__)
# lighttpd root olarak çalışmalı (servis/opkg yönetimi için)
server.username := ""
server.groupname := ""

$SERVER["socket"] == ":__PORT__" {
    server.document-root = "/opt/share/www/z2panel"
    index-file.names = ( "index.html" )
    cgi.assign = ( ".cgi" => "/opt/bin/sh" )
    static-file.exclude-extensions = ( ".cgi", ".sh" )
}
