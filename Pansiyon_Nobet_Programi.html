<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pansiyon Nöbet Programı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
:root{
  --ink:#1b2232; --muted:#5f6b7e; --paper:#eef1f6; --surface:#fff; --surface2:#f7f8fb; --hover:#f3f5fa;
  --line:#d8dee8; --line2:#e8ecf2;
  --brand:#22325a; --brand2:#2f4478; --title:#22325a; --top1:#1b2849; --top2:#2c427a;
  --lamp:#e5a23a; --lampbg:#fdf3e1; --lampink:#8a5a0c;
  --erkek:#1f7489; --erkekbg:#e5f2f5; --kiz:#a83f63; --kizbg:#f8e9ef;
  --warn:#c0392b; --warnbg:#fdecea; --warnink:#7e2318; --ok:#2e7d4f; --okbg:#e7f4eb; --okink:#1e5a37;
  --info:#edf1fb; --infoink:#22325a;
  --wknd:#eaeef8; --closed:#eceef1; --closedink:#8a919d;
  --mf:#5b3d91; --mfbg:#f3eefc; --mfline:#8b6bc4;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);
  --shadow2:0 18px 50px rgba(16,24,40,.25);
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#e4e8f1; --muted:#9ba5b7; --paper:#0e1421; --surface:#161f31; --surface2:#1b2539; --hover:#1f2a41;
  --line:#2c3850; --line2:#232e45;
  --brand:#3b5698; --brand2:#4a67ad; --title:#c5d3f5; --top1:#0b1122; --top2:#1a2849;
  --lampbg:#3a2d15; --lampink:#f2c27a;
  --erkek:#2f97b0; --erkekbg:#13303a; --kiz:#c85b82; --kizbg:#3a1d29;
  --warn:#ee6b5b; --warnbg:#3a1c1a; --warnink:#f6b7ae; --ok:#5cc28a; --okbg:#15301f; --okink:#a8e3c1;
  --info:#1c2944; --infoink:#c5d3f5;
  --wknd:#1a2540; --closed:#141a26; --closedink:#6d7686;
  --mf:#c9b4f0; --mfbg:#2a2140;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --ink:#e4e8f1; --muted:#9ba5b7; --paper:#0e1421; --surface:#161f31; --surface2:#1b2539; --hover:#1f2a41;
  --line:#2c3850; --line2:#232e45;
  --brand:#3b5698; --brand2:#4a67ad; --title:#c5d3f5; --top1:#0b1122; --top2:#1a2849;
  --lampbg:#3a2d15; --lampink:#f2c27a;
  --erkek:#2f97b0; --erkekbg:#13303a; --kiz:#c85b82; --kizbg:#3a1d29;
  --warn:#ee6b5b; --warnbg:#3a1c1a; --warnink:#f6b7ae; --ok:#5cc28a; --okbg:#15301f; --okink:#a8e3c1;
  --info:#1c2944; --infoink:#c5d3f5;
  --wknd:#1a2540; --closed:#141a26; --closedink:#6d7686;
  --mf:#c9b4f0; --mfbg:#2a2140;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;color:var(--ink);background:var(--paper);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* Üst bar */
.top{background:linear-gradient(120deg,var(--top1),var(--top2));color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:240px}
.moon{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 70% 35%,var(--top1) 0 11px,transparent 12px),var(--lamp);flex:none;box-shadow:0 0 0 4px rgba(229,162,58,.18),0 0 22px rgba(229,162,58,.35)}
.brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{margin:0;font-size:14px;opacity:.8}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:7px 12px;font-size:14px;transition:background .15s}
.tbtn:hover{background:rgba(255,255,255,.16)}

/* Adımlar */
.steps{background:var(--surface);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 16px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.step{border:0;background:none;padding:14px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted);font-weight:600;transition:color .15s,border-color .15s}
.step:hover{color:var(--ink)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line2);font-size:14px;font-weight:700;color:var(--muted)}
.step.on{color:var(--title);border-bottom-color:var(--lamp)}
.step.on .n{background:var(--brand);color:#fff}
.step.done .n{background:var(--okbg);color:var(--ok)}
.step.done .n::after{content:"✓";font-size:13px}
.step.done .n span{display:none}
.step small{font-weight:400;color:var(--muted)}

main{max-width:1360px;margin:0 auto;padding:24px}
.view{display:none}
.view.on{display:block;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.intro{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.intro h2{margin:0 0 2px;font-size:26px;font-weight:800;color:var(--title)}
.intro p{margin:0;color:var(--muted);max-width:760px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
label.f input,label.f select{font-weight:400}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);min-height:42px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 18%,transparent);outline:none}
textarea{min-height:120px;resize:vertical;width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.chk small{display:block;color:var(--muted);font-size:14px}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.choice{border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--brand2)}
.choice b{font-size:16px}
.choice span{font-size:14px;color:var(--muted)}
.choice.on{border-color:var(--brand);background:var(--info);box-shadow:inset 0 0 0 1px var(--brand)}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--line2);width:42px;height:42px;font-size:20px;font-weight:700}
.stepper button:hover:not(:disabled){background:var(--line)}
.stepper output{min-width:48px;text-align:center;font-weight:700;font-size:18px}
.gblock{border-left:4px solid var(--erkek);padding:4px 0 4px 14px;margin-bottom:16px}
.gblock.K{border-color:var(--kiz)}
.gblock h4{margin:0 0 10px;font-size:16px}
.slotrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.slotrow label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:42px;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--brand2);background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.big{font-size:17px;padding:11px 22px;min-height:48px}
.btn.lamp{background:var(--lamp);border-color:var(--lamp);color:#241a07;box-shadow:0 2px 10px rgba(229,162,58,.35)}
.btn.lamp:hover{background:#f0b04a;border-color:#f0b04a}
.btn.danger{color:var(--warn)}
.btn.danger:hover{border-color:var(--warn);background:var(--warnbg)}
.btn.pri.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}

/* Belletici tablosu */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:left;vertical-align:middle}
table.t th{background:var(--surface2);font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700;position:sticky;top:0;z-index:1}
table.t tbody tr:hover td{background:var(--hover)}
table.t input[type=text]{width:100%;min-width:150px;min-height:38px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on.E{background:var(--erkek);color:#fff}
.seg button.on.K{background:var(--kiz);color:#fff}
.days{display:flex;gap:4px}
.days button{width:40px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.days button:hover{border-color:var(--warn)}
.days button[aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#fff;text-decoration:line-through}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--line2);border-radius:20px;padding:3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 2px;font-weight:700;color:var(--muted)}
.iconbtn{border:1px solid transparent;background:none;border-radius:6px;padding:6px 8px;color:var(--muted)}
.iconbtn:hover{border-color:var(--line);color:var(--warn)}
.search{min-width:220px}

/* Nöbet listesi */
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav .arrow{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:20px}
.monthnav .arrow:hover{border-color:var(--brand2);background:var(--hover)}
.monthnav select{font-weight:700}
.mtitle{font-size:30px;font-weight:800;color:var(--title);margin:0 8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tile .l{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font-size:26px;font-weight:800;line-height:1.1;margin-top:2px}
.tile .v small{font-size:14px;font-weight:600;color:var(--muted)}
.tile.ok .v{color:var(--ok)}.tile.w .v{color:var(--warn)}
.tile .pb2{height:6px;background:var(--line2);border-radius:3px;margin-top:8px;overflow:hidden}
.tile .pb2 i{display:block;height:100%;background:var(--ok);border-radius:3px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.layout .tw{max-height:calc(100vh - 90px)}
table.nl{border-collapse:separate;border-spacing:0;width:100%}
table.nl th,table.nl td{border-bottom:1px solid var(--line2);padding:6px 8px;background:var(--surface)}
table.nl thead{position:sticky;top:0;z-index:3}
table.nl thead th{background:var(--surface2);font-size:14px;text-align:left}
table.nl thead tr:first-child th.gE{background:var(--erkekbg);color:var(--erkek);border-bottom:3px solid var(--erkek)}
table.nl thead tr:first-child th.gK{background:var(--kizbg);color:var(--kiz);border-bottom:3px solid var(--kiz)}
table.nl td.d,table.nl thead th.d{position:sticky;left:0;z-index:2}
table.nl thead th.d{z-index:4}
table.nl td.d{white-space:nowrap;font-weight:700;width:1%;box-shadow:1px 0 0 var(--line2)}
table.nl td.d small{display:block;font-weight:400;color:var(--muted)}
table.nl tr.we td{background:var(--wknd)}
table.nl tr.closed td{background:var(--closed);color:var(--closedink)}
table.nl tr.today td.d{box-shadow:inset 4px 0 0 var(--lamp),1px 0 0 var(--line2)}
table.nl tr.today td.d::after{content:"Bugün";display:inline-block;margin-top:2px;font-size:11px;font-weight:700;color:var(--lampink);background:var(--lampbg);border-radius:4px;padding:0 5px}
table.nl tbody tr:hover td:not(.d){background:var(--hover)}
table.nl select.gs{min-height:34px;padding:4px 6px;font-size:13px;border-color:transparent;background:transparent;color:var(--muted)}
table.nl select.gs:hover{border-color:var(--line)}
.sc{display:flex;gap:4px;align-items:center}
.sc select{min-width:140px;width:100%;flex:1;min-height:38px;padding:6px 8px}
.sc select.empty{color:var(--muted);border-style:dashed}
.hr{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:44px;height:38px;font-size:13px;font-weight:700;color:var(--muted)}
.hr.N{background:var(--lampbg);border-color:var(--lamp);color:var(--lampink)}
td.bad .sc select{border-color:var(--warn);background:var(--warnbg)}
.wm{font-size:12px;color:var(--warn);margin-top:2px;font-weight:600}
td.hl .sc select{box-shadow:0 0 0 3px var(--lamp)}
.closedlbl{font-style:italic;font-size:14px}
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.side h3{margin:0 0 4px;font-size:17px}
.side p.h{margin:0 0 12px;font-size:13px;color:var(--muted)}
.who{display:grid;grid-template-columns:1fr;gap:3px;align-items:center;padding:7px 8px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.who:hover{background:var(--hover)}
.who.on{background:var(--lampbg)}
.who .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .ct{font-size:13px;color:var(--muted);white-space:nowrap}
.who .barl{grid-column:1/-1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.who .barl i{display:block;height:100%;background:var(--brand2)}
.who.K .barl i{background:var(--kiz)}
.who.E .barl i{background:var(--erkek)}
.who .mfl{color:var(--mf)}
.side .gt{font-size:13px;font-weight:700;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.alert{border-radius:var(--r);padding:12px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.alert::before{font-weight:800;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.alert.w{background:var(--warnbg);color:var(--warnink);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.alert.w::before{content:"!";background:var(--warn);color:#fff}
.alert.o{background:var(--okbg);color:var(--okink);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.alert.o::before{content:"✓";background:var(--ok);color:#fff}
.alert.i{background:var(--info);color:var(--infoink);border-color:color-mix(in srgb,var(--brand2) 20%,transparent)}
.alert.i::before{content:"i";background:var(--brand);color:#fff}
.alert ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 14px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line);background:var(--surface)}

.empty{text-align:center;padding:48px 20px}
.empty h3{font-size:22px;margin:0 0 6px;color:var(--title)}
.empty p{color:var(--muted);margin:0 0 18px}

/* Belge önizleme (her zaman beyaz kâğıt) */
.preview{background:#8e96a3;border-radius:var(--r);padding:24px;overflow:auto}
.page{background:#fff;color:#000;margin:0 auto;padding:14mm 12mm;box-shadow:0 2px 12px rgba(0,0,0,.25);width:210mm;min-height:200mm}
.page.land{width:297mm}
.doc{font-family:"Times New Roman",Times,serif;color:#000;font-size:11pt}
.doc .antet{text-align:center;font-weight:700;line-height:1.3;margin-bottom:8px}
.doc .title{text-align:center;font-weight:700;font-size:12pt;margin:6px 0 10px}
.doc .meta{display:flex;justify-content:space-between;font-size:10pt;margin-bottom:6px;gap:12px;flex-wrap:wrap}
.doc table{border-collapse:collapse;width:100%}
.doc th,.doc td{border:1px solid #000;padding:1.5px 4px;font-size:9.5pt}
.doc th{background:#e6e6e6;text-align:center}
.doc tr.we td{background:#f0f0f0}
.doc .note{font-size:9.5pt;margin-top:8px}
.doc .sign{display:flex;justify-content:space-between;margin-top:16px;font-size:10.5pt;text-align:center;break-inside:avoid}
.doc .sign div{min-width:220px}
.doc .sign .nm{margin-top:28px;font-weight:700}
.doc.small th,.doc.small td{font-size:7.5pt;padding:2px 2px}
.doc.small td.c,.doc.small th.c{text-align:center}
.doc .pb{page-break-after:always;break-after:page}
.doc .pb:last-child{page-break-after:auto;break-after:auto}
.doc .sec{margin-bottom:24px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,15,28,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto;box-shadow:var(--shadow2);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 8px;font-size:20px;color:var(--title)}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;margin-bottom:10px}
.opt b{display:block;font-size:16px}
.opt span{font-size:14px;color:var(--muted)}
.opt:hover{border-color:var(--brand)}
label.opt{cursor:pointer;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;padding:10px 12px}
label.opt input{width:18px;height:18px;margin-top:3px;flex:none}
label.opt:has(input:checked){border-color:var(--brand);background:var(--info)}
.btn.mf{background:var(--mfbg);border-color:var(--mfline);color:var(--mf)}
.who .ct b.over{color:var(--warn)}
.who.over .barl i{background:var(--warn)!important}
.rng{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;margin-top:6px;font-size:14px}
.rng .k{font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;background:var(--closed);color:var(--muted)}
.rng .k.tatil{background:var(--wknd);color:var(--title)}
.mnote{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.slotwarn{color:var(--warn);font-size:13px;font-weight:600;margin-top:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;box-shadow:var(--shadow2)}
.toast.on{opacity:1;transform:translateX(-50%)}

<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="busy" id="busy">Liste hazırlanıyor…</div>
<div id="printArea"></div>
<style id="pageStyle">@page{size:A4 portrait;margin:8mm}</style>

<script>
"use strict";
/* ================== Sabitler ================== */
const GUN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const GK=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GAD={E:'Erkek',K:'Kadın'};
const KEY='pansiyonNobetProgrami_v1';
const VIEWS=['okul','bel','liste','puantaj','yillik'];

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up=s=>String(s||'').toLocaleUpperCase('tr-TR');
const uid=()=>Math.random().toString(36).slice(2,10);
const ymKey=(y,m)=>`${y}-${pad(m)}`;
const pk=k=>{const [y,m]=k.split('-').map(Number);return {y,m}};
const dKey=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fromDate=dt=>dKey(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return fromDate(d)};
const dow=s=>(toDate(s).getDay()+6)%7; // 0=Pzt
const dim=(y,m)=>new Date(y,m,0).getDate();
const trDate=s=>{const [y,m,d]=s.split('-');return `${d}.${m}.${y}`};

/* ================== Veri ================== */
function defaults(){
  const n=new Date();
  return {
    settings:{okulAdi:'',ilce:'',tur:'karma',slot:{E:2,K:2},slotTur:{E:['N','B','B','B'],K:['N','B','B','B']},
      saat:{N:8,B:4},dAd:'',dUnvan:'Pansiyondan Sorumlu Müdür Yardımcısı',mAd:'',mUnvan:'Okul Müdürü',
      resmi:true,yilDikkate:true,ardArda:true,aylikSinir:64,haftalikNobet:2},
    teachers:[],months:{},current:ymKey(n.getFullYear(),n.getMonth()+1),view:'okul'
  };
}
function load(){
  let r=null;
  try{r=localStorage.getItem(KEY);if(!r)return null;return merge(JSON.parse(r))}
  catch(e){ // bozuk kayıt üzerine yazılmadan önce ayrı bir anahtara saklanır
    try{if(r)localStorage.setItem(KEY+'_bozuk_'+Date.now(),r)}catch(x){}
    return null}
}
function merge(o){
  const d=defaults();
  const s=Object.assign({},d,o);
  s.settings=Object.assign({},d.settings,o.settings||{});
  s.settings.slot=Object.assign({},d.settings.slot,(o.settings||{}).slot||{});
  s.settings.slotTur=Object.assign({},d.settings.slotTur,(o.settings||{}).slotTur||{});
  s.settings.saat=Object.assign({},d.settings.saat,(o.settings||{}).saat||{});
  if(!['karma','erkek','kiz'].includes(s.settings.tur))s.settings.tur='karma';
  for(const g of ['E','K']){const a=Array.isArray(s.settings.slotTur[g])?s.settings.slotTur[g]:[];
    s.settings.slotTur[g]=[0,1,2,3].map(i=>a[i]==='N'||a[i]==='B'?a[i]:d.settings.slotTur[g][i])}
  const seen=new Set();
  s.teachers=(Array.isArray(s.teachers)?s.teachers:[]).filter(t=>t&&typeof t==='object').map(t=>{
    const x=Object.assign({id:uid(),ad:'',kurum:'',cins:'E',kapali:[0,0,0,0,0,0,0],izin:[]},t);
    x.id=String(x.id);if(!/^[\w-]{1,40}$/.test(x.id)||seen.has(x.id))x.id=uid();seen.add(x.id);
    x.ad=String(x.ad??'');x.kurum=String(x.kurum??'');x.cins=x.cins==='K'?'K':'E';
    x.kapali=[0,1,2,3,4,5,6].map(i=>Array.isArray(x.kapali)&&x.kapali[i]?1:0);
    x.izin=(Array.isArray(x.izin)?x.izin:[]).filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(v));
    return x});
  s.months=(s.months&&typeof s.months==='object')?s.months:{};
  for(const k in s.months){const M=s.months[k];
    if(!/^\d{4}-\d{2}$/.test(k)||!M||typeof M!=='object'){delete s.months[k];continue}
    for(const dd in M.gun||{})if(!['tatil','kapali'].includes(M.gun[dd]))delete M.gun[dd];
    for(const dd in M.cells||{})for(const g in M.cells[dd]){const a=M.cells[dd][g];
      if(!Array.isArray(a)){delete M.cells[dd][g];continue}
      a.forEach((c,i)=>{if(!c||typeof c!=='object')a[i]=c={t:null,tur:null};if(c.tur!=='N'&&c.tur!=='B')c.tur=null;if(c.t!=null)c.t=String(c.t)})}}
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(s.current))s.current=d.current;
  if(!VIEWS.includes(s.view))s.view='okul';
  return s;
}
let S=load()||defaults();
let saveT=null;
function saveNow(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Tarayıcı kaydı yapılamadı. Lütfen “Yedek al” ile dosyaya kaydedin.')}}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
addEventListener('pagehide',()=>{if(saveT)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)saveNow()});

const G=()=>S.settings.tur==='erkek'?['E']:S.settings.tur==='kiz'?['K']:['E','K'];
const T=id=>S.teachers.find(t=>t.id===id);
const tBy=g=>S.teachers.filter(t=>t.cins===g);
const slotN=g=>Math.max(1,Math.min(4,+S.settings.slot[g]||1));
const hrs=tur=>+S.settings.saat[tur]||0;
const turLbl=tur=>tur==='N'?`Nöbetçi belletici (${hrs('N')} saat)`:`Belletici (${hrs('B')} saat)`;

function month(k){
  if(!S.months[k])S.months[k]={cells:{},gun:{},gunAc:{}};
  const M=S.months[k];M.cells=M.cells||{};M.gun=M.gun||{};M.gunAc=M.gunAc||{};return M;
}
function cell(k,date,g){
  const M=month(k);
  if(!M.cells[date])M.cells[date]={};
  if(!M.cells[date][g])M.cells[date][g]=[];
  const a=M.cells[date][g];
  while(a.length<slotN(g))a.push({t:null,tur:null});
  return a;
}
function peek(date,g,i){ // okuma - veri oluşturmadan
  const M=S.months[date.slice(0,7)];if(!M||!M.cells||!M.cells[date]||!M.cells[date][g])return null;
  const c=M.cells[date][g][i];return c||null;
}
const turOf=(date,g,i)=>{const c=peek(date,g,i);return (c&&c.tur)||S.settings.slotTur[g][i]||'B'};
const gunDur=date=>{const M=S.months[date.slice(0,7)];return (M&&M.gun&&M.gun[date])||''};
const isWE=date=>{const d=dow(date);return d>=5||gunDur(date)==='tatil'};
const isClosed=date=>gunDur(date)==='kapali';
const gunAc=date=>{const M=S.months[date.slice(0,7)];return (M&&M.gunAc&&M.gunAc[date])||''};
/* Muafiyet (hamilelik, süt izni vb.) */
const MUAF={hamile:'Hamilelik',sut:'Süt izni',engel:'Engellilik',rapor:'Sağlık raporu',diger:'Diğer'};
function muafOn(t,date){const m=t&&t.muaf;if(!m||!m.tur)return '';if(m.bas&&date<m.bas)return '';if(m.bit&&date>m.bit)return '';return MUAF[m.tur]||'Muaf'}
/* Mevzuat sınırları */
const capH=()=>Math.max(0,+S.settings.aylikSinir||0);   // aylık azami ek ders saati (0 = denetleme yok)
const capW=()=>Math.max(0,+S.settings.haftalikNobet||0);// haftalık azami gece sayısı (0 = sınır yok)
const weekStart=date=>addDays(date,-dow(date));          // haftanın pazartesisi
function datesOf(k){const {y,m}=pk(k);const r=[];for(let d=1;d<=dim(y,m);d++)r.push(dKey(y,m,d));return r}
function assignedOn(date){ // tarih -> kişi id kümesi (başka ayın günleri de salt okunur olarak okunur)
  const set=new Set();if(isClosed(date))return set;
  for(const g of G())for(let i=0;i<slotN(g);i++){const c=peek(date,g,i);if(c&&c.t)set.add(c.t)}
  return set;
}
function weekCountOf(date,id){ // pazartesi-pazar haftasında kişinin gece sayısı (ay sınırını aşar)
  let n=0;const w=weekStart(date);for(let j=0;j<7;j++)if(assignedOn(addDays(w,j)).has(id))n++;return n;
}
function statsMonth(k){
  const st={};
  for(const date of datesOf(k)){
    if(isClosed(date))continue;
    const we=isWE(date);
    for(const g of G())for(let i=0;i<slotN(g);i++){
      const c=peek(date,g,i);if(!c||!c.t)continue;
      const s=st[c.t]||(st[c.t]={wd:0,we:0,h:0,nn:0,days:{}});
      we?s.we++:s.wd++;
      const tu=(c.tur)||S.settings.slotTur[g][i]||'B';
      s.h+=hrs(tu);if(tu==='N')s.nn++;
      s.days[date]=(s.days[date]||0)+hrs(tu);
    }
  }
  return st;
}
function eyMonths(k){ // eğitim yılı ayları (Eylül-Ağustos)
  const {y,m}=pk(k);const y0=m>=9?y:y-1;const r=[];
  for(let i=0;i<12;i++){const mm=((8+i)%12)+1;const yy=mm>=9?y0:y0+1;r.push(ymKey(yy,mm))}
  return r;
}
const eyText=k=>{const {y,m}=pk(k);const y0=m>=9?y:y-1;return `${y0} - ${y0+1}`};
function prevStats(k){
  const tot={};
  for(const mk of eyMonths(k)){if(mk>=k)break;if(!S.months[mk])continue;
    const st=statsMonth(mk);for(const id in st){const a=tot[id]||(tot[id]={wd:0,we:0,h:0,nn:0});a.wd+=st[id].wd;a.we+=st[id].we;a.h+=st[id].h;a.nn+=st[id].nn}}
  return tot;
}

/* ================== Sorun denetimi ================== */
function cellIssues(date,g,i,id){
  const r=[];const t=T(id);
  if(!t)return ['Kayıt silinmiş'];
  if(t.cins!==g)r.push('Cinsiyet uyumsuz');
  if(t.kapali[dow(date)])r.push('Kapalı günü');
  if((t.izin||[]).includes(date))r.push('İzinli / raporlu');
  const mf=muafOn(t,date);if(mf)r.push('Muaf: '+mf);
  let same=0;for(const gg of G())for(let j=0;j<slotN(gg);j++){const c=peek(date,gg,j);if(c&&c.t===id)same++}
  if(same>1)r.push('Aynı gün iki kez');
  if(S.settings.ardArda){const p=addDays(date,-1),n=addDays(date,1);if(assignedOn(p).has(id)||assignedOn(n).has(id))r.push(p.slice(0,7)!==date.slice(0,7)&&assignedOn(p).has(id)||n.slice(0,7)!==date.slice(0,7)&&assignedOn(n).has(id)?'Art arda gün (ay geçişi)':'Art arda gün')}
  if(capW()&&weekCountOf(date,id)>capW())r.push(`Haftada ${capW()} geceden fazla`);
  return r;
}
function allIssues(k){
  const out=[];let bos=0;const run={};const cap=capH();
  for(const date of datesOf(k)){if(isClosed(date))continue;
    for(const g of G())for(let i=0;i<slotN(g);i++){const c=peek(date,g,i);
      if(!c||!c.t){bos++;continue}
      run[c.t]=(run[c.t]||0)+hrs(turOf(date,g,i));
      const is=cellIssues(date,g,i,c.t);
      if(cap&&run[c.t]>cap)is.push(`Aylık ${cap} saat sınırı aşıldı`);
      if(is.length)out.push({date,g,i,id:c.t,is})}}
  return {out,bos};
}

/* ================== Otomatik dağıtım ================== */
function autoFill(mode){
  const k=S.current;const all=datesOf(k);const dates=all.filter(d=>!isClosed(d));
  const prev=S.settings.yilDikkate?prevStats(k):{};
  const res={gaps:0,consec:0,week:0,cap:0,edge:0,prevMissing:false};
  const cap=capH(),wcap=capW(),ard=S.settings.ardArda;
  const first=all[0],last=all[all.length-1];
  /* Ay geçişi: önceki ayın son günleri ile sonraki ayın ilk günleri (ve ayı kesen haftalar)
     S.months üzerinden salt okunur ve kesin olarak alınır. */
  const outside={};
  const addOut=d=>{if(!(d in outside))outside[d]=assignedOn(d)};
  for(let d=weekStart(first);d<first;d=addDays(d,1))addOut(d);
  for(let d=addDays(last,1),e=addDays(weekStart(last),6);d<=e;d=addDays(d,1))addOut(d);
  [addDays(first,-2),addDays(first,-1),addDays(last,1),addDays(last,2)].forEach(addOut);
  const p1=addDays(first,-1),p2=addDays(first,-2);
  if(eyMonths(k)[0]!==k&&!isClosed(p1)&&!isClosed(p2)&&!outside[p1].size&&!outside[p2].size)res.prevMissing=true;
  if(mode!=='bos')for(const g of G())for(const d of dates){const a=cell(k,d,g);for(let i=0;i<slotN(g);i++)a[i].tur=null}
  for(const g of G()){
    const n=slotN(g);const cands=tBy(g);if(!cands.length){res.gaps+=dates.length*n;continue}
    const minPrev=Math.min(...cands.map(t=>(prev[t.id]||{}).h||0));
    const minPrevWe=Math.min(...cands.map(t=>(prev[t.id]||{}).we||0));
    const pv=id=>{const p=prev[id]||{};return {h:((p.h||0)-minPrev)*0.5,we:((p.we||0)-minPrevWe)*0.5}};
    let best=null,bestCost=Infinity;
    const tries=Math.max(120,Math.min(500,Math.round(60000/(dates.length*n*Math.max(1,cands.length)))));
    for(let a=0;a<tries;a++){
      const asg={};const cnt={};const wk={};
      const wkey=(d,id)=>weekStart(d)+'|'+id;
      for(const d in outside)for(const id of outside[d]){const x=wkey(d,id);wk[x]=(wk[x]||0)+1}
      cands.forEach(t=>cnt[t.id]={h:0,we:0,wd:0,nn:0});
      const add=(id,date,i)=>{const c=cnt[id];if(!c)return;const tu=turOf(date,g,i);c.h+=hrs(tu);if(tu==='N')c.nn++;isWE(date)?c.we++:c.wd++;const x=wkey(date,id);wk[x]=(wk[x]||0)+1};
      for(const d of dates){asg[d]=[];for(let i=0;i<n;i++){const c=peek(d,g,i);const id=(mode==='bos'&&c&&c.t&&T(c.t))?c.t:null;asg[d][i]=id;if(id)add(id,d,i)}}
      const has=(d,id)=>asg[d]?asg[d].includes(id):(outside[d]?outside[d].has(id):assignedOn(d).has(id));
      let gaps=0,consec=0,week=0,capx=0,edge=0;
      // Hafta sonlarını önce, sonra hafta içini doldur (hafta sonu adaleti için)
      const order=[...dates.filter(isWE),...dates.filter(d=>!isWE(d))];
      for(const d of order){
        const we=isWE(d);const dw=dow(d);const dp=addDays(d,-1),dn=addDays(d,1);
        for(let i=0;i<n;i++){
          if(asg[d][i])continue;
          const tu=turOf(d,g,i);
          let bt=null,bf=null;
          // 0: tüm kurallar, 1: haftalık sınır + ay geçişi gevşer, 2: aylık saat sınırı da gevşer
          for(let lvl=0;lvl<3&&!bt;lvl++){
            let bs=Infinity;
            for(const t of cands){
              if(t.kapali[dw]||(t.izin||[]).includes(d)||asg[d].includes(t.id)||muafOn(t,d))continue;
              const c=cnt[t.id];const p=pv(t.id);
              const wOver=wcap>0&&(wk[wkey(d,t.id)]||0)>=wcap;
              const hOver=cap>0&&c.h+hrs(tu)>cap;
              const eAdj=ard&&((!asg[dp]&&has(dp,t.id))||(!asg[dn]&&has(dn,t.id)));
              if(lvl<1&&(wOver||eAdj))continue;
              if(lvl<2&&hOver)continue;
              let s=(c.h+p.h)*10+(we?(c.we+p.we)*30:c.wd*6)+(tu==='N'?c.nn*12:0);
              const adj=ard&&(has(dp,t.id)||has(dn,t.id));
              if(adj)s+=600;
              if(has(addDays(d,-2),t.id)||has(addDays(d,2),t.id))s+=40;
              if(wOver)s+=900;if(hOver)s+=3000;
              s+=Math.random()*14;
              if(s<bs){bs=s;bt=t.id;bf={adj,wOver,hOver,eAdj}}
            }
          }
          if(!bt){gaps++;continue}
          asg[d][i]=bt;add(bt,d,i);
          if(bf.adj)consec++;if(bf.wOver)week++;if(bf.hOver)capx++;if(bf.eAdj)edge++;
        }
      }
      const H=cands.map(t=>cnt[t.id].h+pv(t.id).h),W=cands.map(t=>cnt[t.id].we+pv(t.id).we),N=cands.map(t=>cnt[t.id].nn);
      const cost=gaps*1e8+capx*1e7+edge*1e6+week*2e4+consec*1e4+variance(H)+variance(W)*60+variance(N)*20;
      if(cost<bestCost){bestCost=cost;best={asg,gaps,consec,week,capx,edge}}
    }
    for(const d of dates){const a=cell(k,d,g);for(let i=0;i<n;i++)a[i].t=best.asg[d][i]||null}
    res.gaps+=best.gaps;res.consec+=best.consec;res.week+=best.week;res.cap+=best.capx;res.edge+=best.edge;
  }
  save();return res;
}
function variance(a){if(!a.length)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length}

/* ================== Genel arayüz ================== */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
let onModalClose=null,modalFrom=null;
function modal(html,onClose){
  if(!$('#ov').classList.contains('on')){modalFrom=document.activeElement;onModalClose=onClose||null}
  else if(onClose!==undefined)onModalClose=onClose;
  $('#modal').innerHTML=html;$('#ov').classList.add('on');const f=$('#modal').querySelector('input,textarea,select,button');f&&f.focus()}
function closeModal(){
  if(!$('#ov').classList.contains('on'))return;
  $('#ov').classList.remove('on');const cb=onModalClose;onModalClose=null;
  if(cb)cb();else if(modalFrom&&document.contains(modalFrom))modalFrom.focus();modalFrom=null}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))closeModal()});
function ask(title,text,okText,onOk,danger){
  modal(`<h3>${esc(title)}</h3><p>${text}</p><div class="acts"><button class="btn" data-x>Vazgeç</button><button class="btn pri ${danger?'danger':''}" data-ok>${esc(okText)}</button></div>`,null);
  $('#modal [data-x]').onclick=closeModal;$('#modal [data-ok]').onclick=()=>{closeModal();onOk()};
}

function go(v){
  S.view=v;save();
  $$('.step').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);if(b.dataset.v===v)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
  $$('.view').forEach(s=>{const on=s.id==='view-'+v;s.classList.toggle('on',on);if(!on)s.innerHTML=''});
  render();window.scrollTo({top:0});
}
$$('.step').forEach(b=>b.onclick=()=>go(b.dataset.v));
function header(){
  const s=S.settings;
  $('#topSchool').textContent=s.okulAdi?`${s.okulAdi}${s.ilce?' – '+s.ilce:''} · ${eyText(S.current)} eğitim öğretim yılı`:'Okul bilgilerini girerek başlayın';
  $('#cntBel').textContent=S.teachers.length?`(${S.teachers.length})`:'';
  $$('.step').forEach(b=>{const v=b.dataset.v;b.classList.toggle('done',(v==='okul'&&!!s.okulAdi)||(v==='bel'&&S.teachers.length>0))});
}
function render(){
  header();
  const v=S.view;
  if(v==='okul')rOkul();else if(v==='bel')rBel();else if(v==='liste')rListe();else if(v==='puantaj')rPuantaj();else if(v==='yillik')rYillik();else go('okul');
}
function intro(title,text){return `<div class="intro"><div><h2>${title}</h2><p>${text}</p></div></div>`}

/* ================== 1. Okul bilgileri ================== */
function rOkul(){
  const s=S.settings;
  const slotBlock=g=>{
    let h=`<div class="gblock ${g}"><h4>${g==='E'?'Erkek':'Kız'} pansiyonu – her gece kaç belletici?</h4>
      <div class="stepper"><button data-dec="${g}" aria-label="Azalt" ${slotN(g)<=1?'disabled':''}>−</button><output>${slotN(g)}</output><button data-inc="${g}" aria-label="Artır" ${slotN(g)>=4?'disabled':''}>+</button></div>
      <div class="slotrow">`;
    for(let i=0;i<slotN(g);i++)h+=`<label>${i+1}. belletici görev türü<select data-st="${g}" data-i="${i}">
      <option value="N" ${s.slotTur[g][i]==='N'?'selected':''}>Nöbetçi belletici (${hrs('N')} saat)</option>
      <option value="B" ${s.slotTur[g][i]!=='N'?'selected':''}>Belletici (${hrs('B')} saat)</option></select></label>`;
    h+=`</div>`;
    if(slotN(g)>3)h+=`<div class="slotwarn">Uyarı: Ders ve Ek Ders Saatlerine İlişkin Karar'ın 13. maddesine göre bir günde 3'ten fazla belletici görevlendirilemez.</div>`;
    return h+`</div>`;
  };
  $('#view-okul').innerHTML=intro('Okul bilgileri','Bu bilgiler listelerin ve puantajların başlığında kullanılır. Bir kez doldurmanız yeterlidir.')+`
  ${!S.teachers.length?`<div class="alert i"><div><b>İlk kez mi kullanıyorsunuz?</b> Programı denemek isterseniz örnek verileri yükleyebilirsiniz. Daha sonra silip kendi bilgilerinizi girebilirsiniz.<div style="margin-top:8px"><button class="btn sm" id="demo">Örnek verileri yükle</button></div></div></div>`:''}
  <div class="card"><h3>Okul</h3><div class="grid">
    <label class="f">Okul adı<input type="text" data-k="okulAdi" value="${esc(s.okulAdi)}" placeholder="Örn. Yatılı Bölge Ortaokulu"></label>
    <label class="f">İlçe<input type="text" data-k="ilce" value="${esc(s.ilce)}" placeholder="Örn. Kozluk"></label>
  </div></div>
  <div class="card"><h3>Pansiyon türü</h3><div class="choices">
    <button class="choice ${s.tur==='karma'?'on':''}" data-tur="karma"><b>Kız ve erkek pansiyonu</b><span>Erkek ve kadın belleticiler ayrı ayrı nöbet tutar</span></button>
    <button class="choice ${s.tur==='erkek'?'on':''}" data-tur="erkek"><b>Yalnız erkek pansiyonu</b><span>Sadece erkek belleticiler</span></button>
    <button class="choice ${s.tur==='kiz'?'on':''}" data-tur="kiz"><b>Yalnız kız pansiyonu</b><span>Sadece kadın belleticiler</span></button>
  </div></div>
  <div class="card"><h3>Gecelik belletici sayısı ve görev türü</h3>
    ${G().map(slotBlock).join('')}
    <p style="margin:6px 0 0;color:var(--muted);font-size:14px">Görev türünü nöbet listesinde her kişi için ayrıca değiştirebilirsiniz.</p>
  </div>
  <div class="card"><h3>Ek ders saatleri (günlük)</h3><div class="grid">
    <label class="f">Nöbetçi belletici<input type="number" min="0" max="24" data-saat="N" value="${hrs('N')}"></label>
    <label class="f">Belletici<input type="number" min="0" max="24" data-saat="B" value="${hrs('B')}"></label>
  </div></div>
  <div class="card"><h3>Mevzuat sınırları</h3><div class="grid">
    <label class="f">Aylık azami belleticilik ek ders saati<input type="number" min="0" max="400" data-lim="aylikSinir" value="${capH()}"><span class="h">Bir öğretmene bir ayda yazılabilecek en fazla saat. 0 yazılırsa denetlenmez.</span></label>
    <label class="f">Bir öğretmene haftada en fazla gece<input type="number" min="0" max="7" data-lim="haftalikNobet" value="${capW()}"><span class="h">Pazartesi–Pazar haftası; ay geçişindeki haftalar da sayılır. 0 yazılırsa sınır yok.</span></label>
  </div>
  <p class="mnote">Karar'ın 13. maddesi: her belleticilik görevi için 4 saat, 24 saat nöbet tutanlara ilave saat ödenir; bir günde 3'ten fazla belletici görevlendirilemez ve aylık ödenecek ek ders ücreti Karar metninde 56 saattir. Toplu sözleşme hükmüyle bu sınır 64 saat olarak uygulanmaktadır. Kurumunuzdaki güncel uygulamayı tahakkuk birimiyle teyit ederek değeri düzenleyin. Haftalık gece sınırı mevzuat hükmü değil, dengeli dağıtım için okul tercihidir.</p>
  <p class="mnote">Otomatik dağıtım bu sınırları aşmamaya çalışır; kişi yetmezse aşar ve listede uyarı gösterir.</p>
  </div>
  <div class="card"><h3>İmza yetkilileri</h3><div class="grid">
    <label class="f">Düzenleyen adı soyadı<input type="text" data-k="dAd" value="${esc(s.dAd)}"></label>
    <label class="f">Düzenleyen unvanı<input type="text" data-k="dUnvan" value="${esc(s.dUnvan)}"></label>
    <label class="f">Okul müdürü adı soyadı<input type="text" data-k="mAd" value="${esc(s.mAd)}"></label>
    <label class="f">Müdür unvanı<input type="text" data-k="mUnvan" value="${esc(s.mUnvan)}"></label>
  </div></div>
  <div class="card"><h3>Dağıtım tercihleri</h3>
    <label class="chk"><input type="checkbox" data-c="ardArda" ${s.ardArda?'checked':''}><span><b>Art arda iki gece nöbet verme</b><small>Bir öğretmene peş peşe iki gece görev yazılmamaya çalışılır.</small></span></label>
    <label class="chk"><input type="checkbox" data-c="yilDikkate" ${s.yilDikkate?'checked':''}><span><b>Önceki ayları da dikkate al</b><small>Geçen aylarda çok nöbet tutanlara bu ay biraz daha az nöbet verilir.</small></span></label>
    <label class="chk" style="margin-bottom:0"><input type="checkbox" data-c="resmi" ${s.resmi?'checked':''}><span><b>Çıktılarda resmî başlık kullan</b><small>T.C. / Kaymakamlık / İlçe Milli Eğitim Müdürlüğü / Okul adı</small></span></label>
  </div>
  <div class="bar"><span class="sp"></span><button class="btn pri big" id="toBel">Devam: Belleticileri ekle</button></div>`;
  const v=$('#view-okul');
  v.querySelectorAll('[data-k]').forEach(i=>{
    if(i.dataset.k==='okulAdi')i.onfocus=()=>{i._old=s.okulAdi};
    i.oninput=()=>{s[i.dataset.k]=i.value;save();header()};
    if(i.dataset.k==='okulAdi')i.onchange=()=>{const o=i._old,nw=s.okulAdi.trim();s.okulAdi=nw;i.value=nw;
      if(o&&nw&&o!==nw){let n=0;S.teachers.forEach(t=>{if(t.kurum===o){t.kurum=nw;n++}});if(n)toast(`${n} belleticinin kurum adı da güncellendi`)}
      i._old=nw;save();header()}});
  v.querySelectorAll('[data-saat]').forEach(i=>i.onchange=()=>{s.saat[i.dataset.saat]=Math.min(24,Math.max(0,+i.value||0));save();rOkul()});
  v.querySelectorAll('[data-lim]').forEach(i=>i.onchange=()=>{s[i.dataset.lim]=Math.min(+i.max||999,Math.max(0,Math.round(+i.value||0)));save();rOkul()});
  v.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{s[i.dataset.c]=i.checked;save()});
  v.querySelectorAll('[data-tur]').forEach(b=>b.onclick=()=>{s.tur=b.dataset.tur;save();rOkul();header()});
  v.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const g=b.dataset.inc;s.slot[g]=Math.min(4,slotN(g)+1);save();rOkul()});
  v.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const g=b.dataset.dec;s.slot[g]=Math.max(1,slotN(g)-1);save();rOkul()});
  v.querySelectorAll('[data-st]').forEach(x=>x.onchange=()=>{s.slotTur[x.dataset.st][+x.dataset.i]=x.value;save()});
  $('#toBel').onclick=()=>go('bel');
  const d=$('#demo');if(d)d.onclick=loadDemo;
}

/* ================== 2. Belleticiler ================== */
function rBel(){
  const gs=G();
  const kurumlar=[...new Set([S.settings.okulAdi,...S.teachers.map(t=>t.kurum)].filter(Boolean))];
  let rows='';
  S.teachers.forEach((t,ix)=>{
    rows+=`<tr data-id="${esc(t.id)}">
      <td style="color:var(--muted);width:1%">${ix+1}</td>
      <td><input type="text" data-f="ad" value="${esc(t.ad)}" placeholder="Adı soyadı" aria-label="Adı soyadı"></td>
      <td><input type="text" data-f="kurum" value="${esc(t.kurum)}" list="kurumList" placeholder="Görevli olduğu okul" aria-label="Görevli olduğu okul"></td>
      <td><div class="seg" role="group" aria-label="Cinsiyet"><button class="E ${t.cins==='E'?'on':''}" data-cins="E">Erkek</button><button class="K ${t.cins==='K'?'on':''}" data-cins="K">Kadın</button></div></td>
      <td><div class="days">${GK.map((g,i)=>`<button aria-pressed="${!!t.kapali[i]}" data-kd="${i}" title="${GUN[i]} – tıklayınca bu gün nöbet verilmez">${g}</button>`).join('')}</div></td>
      <td><button class="btn sm" data-izin>${(t.izin||[]).length?`${t.izin.length} tarih`:'Ekle'}</button></td>
      <td><button class="btn sm ${t.muaf&&t.muaf.tur?'mf':''}" data-muaf title="${t.muaf&&t.muaf.ac?esc(t.muaf.ac):'Hamilelik, süt izni vb. muafiyet'}">${muafLbl(t)}</button></td>
      <td style="width:1%"><button class="iconbtn" data-del title="Sil" aria-label="Sil">✕</button></td></tr>`;
  });
  const cE=S.teachers.filter(t=>t.cins==='E').length,cK=S.teachers.filter(t=>t.cins==='K').length;
  let warn='';
  const need=gs.map(g=>{const n=slotN(g),c=g==='E'?cE:cK;return c<n*2?`${GAD[g]} belletici sayısı (${c}) az görünüyor. Her gece ${n} kişi gerektiği için en az ${n*2} kişi önerilir.`:''}).filter(Boolean);
  if(S.teachers.length&&need.length)warn=`<div class="alert w"><div>${need.join('<br>')}</div></div>`;
  $('#view-bel').innerHTML=intro('Belletici öğretmenler','Belletici öğretmenleri ekleyin. Nöbet almak istemedikleri günlere tıklayın (kırmızı olur). İzinli ya da raporlu oldukları tarihleri de ekleyebilirsiniz.')+`
  <div class="bar" style="margin-bottom:14px">
    <button class="btn pri" id="addT">+ Belletici ekle</button>
    <button class="btn" id="pasteT">Excel'den yapıştır</button>
    <span class="sp"></span>
    <span style="color:var(--muted);font-size:14px">${cE} erkek, ${cK} kadın</span>
    <button class="btn sm" id="sortT">A–Z sırala</button>
  </div>
  ${warn}
  ${S.teachers.length?`<div class="tw"><table class="t"><thead><tr><th>#</th><th>Adı soyadı</th><th>Görevli olduğu okul / kurum</th><th>Cinsiyet</th><th>Nöbet istemediği günler</th><th>İzinli tarihler</th><th>Muafiyet</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
  :`<div class="card empty"><h3>Henüz belletici yok</h3><p>“Belletici ekle” ile tek tek girebilir ya da Excel'deki listenizi kopyalayıp yapıştırabilirsiniz.</p><button class="btn pri big" id="addT2">+ İlk belleticiyi ekle</button></div>`}
  <datalist id="kurumList">${kurumlar.map(k=>`<option value="${esc(k)}">`).join('')}</datalist>
  <div class="bar" style="margin-top:18px"><button class="btn" id="backO">Geri</button><span class="sp"></span><button class="btn pri big" id="toL">Devam: Nöbet listesini hazırla</button></div>`;
  const v=$('#view-bel');
  const addNew=()=>{const g=gs.length===1?gs[0]:(S.teachers.length?S.teachers[S.teachers.length-1].cins:'E');
    S.teachers.push({id:uid(),ad:'',kurum:S.teachers.length?S.teachers[S.teachers.length-1].kurum:S.settings.okulAdi,cins:g,kapali:[0,0,0,0,0,0,0],izin:[]});save();rBel();header();
    const ins=$$('#view-bel input[data-f=ad]');ins[ins.length-1].focus()};
  $('#addT').onclick=addNew;const a2=$('#addT2');if(a2)a2.onclick=addNew;
  $('#pasteT').onclick=pasteModal;
  $('#sortT').onclick=()=>{S.teachers.sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));save();rBel()};
  $('#backO').onclick=()=>go('okul');$('#toL').onclick=()=>go('liste');
  v.querySelectorAll('tr[data-id]').forEach(tr=>{
    const t=T(tr.dataset.id);
    tr.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{t[i.dataset.f]=i.value;save()});
    tr.querySelectorAll('[data-cins]').forEach(b=>b.onclick=()=>{t.cins=b.dataset.cins;save();rBel()});
    tr.querySelectorAll('[data-kd]').forEach(b=>b.onclick=()=>{const i=+b.dataset.kd;t.kapali[i]=t.kapali[i]?0:1;b.setAttribute('aria-pressed',!!t.kapali[i]);save()});
    tr.querySelector('[data-izin]').onclick=()=>izinModal(t);
    tr.querySelector('[data-muaf]').onclick=()=>muafModal(t);
    tr.querySelector('[data-del]').onclick=()=>ask('Belleticiyi sil',`<b>${esc(t.ad||'Adsız kayıt')}</b> silinecek. Nöbet listelerindeki görevleri de boşaltılacak.`,'Sil',()=>{
      S.teachers=S.teachers.filter(x=>x.id!==t.id);
      for(const k in S.months)for(const d in S.months[k].cells)for(const g in S.months[k].cells[d])S.months[k].cells[d][g].forEach(c=>{if(c.t===t.id)c.t=null});
      save();rBel();header();toast('Belletici silindi')},true);
  });
}
function izinModal(t){
  const draw=()=>{
    modal(`<h3>İzinli / raporlu tarihler</h3><p>${esc(t.ad||'Bu belletici')} seçilen tarihlerde nöbete yazılmaz.</p>
    <div class="bar"><input type="date" id="izD" style="flex:1"><button class="btn pri" id="izA">Ekle</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">${(t.izin||[]).sort().map(d=>`<span class="chip">${trDate(d)} <button data-rm="${esc(d)}" aria-label="Kaldır">✕</button></span>`).join('')||'<span style="color:var(--muted)">Henüz tarih eklenmedi.</span>'}</div>
    <div class="acts"><button class="btn pri" data-x>Tamam</button></div>`,rBel);
    const add=()=>{const v=$('#izD').value;if(!v)return;t.izin=t.izin||[];if(!t.izin.includes(v))t.izin.push(v);save();draw()};
    $('#izA').onclick=add;$('#izD').onkeydown=e=>{if(e.key==='Enter')add()};
    $$('#modal [data-rm]').forEach(b=>b.onclick=()=>{t.izin=t.izin.filter(x=>x!==b.dataset.rm);save();draw()});
    $('#modal [data-x]').onclick=closeModal;
  };draw();
}
function muafLbl(t){const m=t.muaf;if(!m||!m.tur)return 'Yok';return esc(MUAF[m.tur]||'Muaf')+(m.bit?` · ${trDate(m.bit)}'e kadar`:'')}
function muafModal(t){
  const m=t.muaf||{};
  modal(`<h3>Nöbet muafiyeti</h3><p>${esc(t.ad||'Bu belletici')} muafiyet süresince otomatik dağıtımda hiç görev almaz. Elle yazılırsa listede kırmızı uyarı çıkar.</p>
  <label class="f">Muafiyet nedeni<select id="mfT"><option value="">Muafiyet yok</option>${Object.entries(MUAF).map(([k,v])=>`<option value="${k}" ${m.tur===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <div class="grid" style="margin-top:12px"><label class="f">Başlangıç<input type="date" id="mfB" value="${esc(m.bas||'')}"><span class="h">Boşsa hemen başlar</span></label>
  <label class="f">Bitiş<input type="date" id="mfS" value="${esc(m.bit||'')}"><span class="h">Boşsa süresiz</span></label></div>
  <label class="f" style="margin-top:12px">Açıklama / dayanak<input type="text" id="mfA" value="${esc(m.ac||'')}" placeholder="Örn. dilekçe tarihi, rapor bilgisi"></label>
  <label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input type="checkbox" id="mfC" checked style="width:18px;height:18px"><span>Bu süredeki mevcut görevlerini listeden boşalt</span></label>
  <div class="acts"><button class="btn" data-x>Vazgeç</button><button class="btn pri" id="mfOk">Kaydet</button></div>`);
  $('#modal [data-x]').onclick=closeModal;
  $('#mfOk').onclick=()=>{
    let tur=$('#mfT').value,bas=$('#mfB').value,bit=$('#mfS').value;
    if(bas&&bit&&bas>bit)[bas,bit]=[bit,bas];
    t.muaf=tur?{tur,bas,bit,ac:$('#mfA').value.trim()}:{tur:'',bas:'',bit:'',ac:''};
    let n=0;
    if(tur&&$('#mfC').checked)for(const k in S.months)for(const d in S.months[k].cells){if(!muafOn(t,d))continue;
      for(const g in S.months[k].cells[d])S.months[k].cells[d][g].forEach(c=>{if(c.t===t.id){c.t=null;n++}})}
    save();closeModal();rBel();toast(tur?`Muafiyet kaydedildi${n?` · ${n} görev boşaltıldı`:''}`:'Muafiyet kaldırıldı');
  };
}
function pasteModal(){
  modal(`<h3>Excel'den yapıştır</h3><p>Excel'de <b>Adı Soyadı</b>, <b>Görevli olduğu okul</b> ve <b>Cinsiyet</b> sütunlarını seçip kopyalayın (Ctrl+C), aşağıya yapıştırın (Ctrl+V). Yalnızca isim sütunu da yapıştırabilirsiniz.</p>
  <textarea id="pT" placeholder="Ahmet YILMAZ	Yatılı Bölge Ortaokulu	Erkek&#10;Ayşe KAYA	Yatılı Bölge Ortaokulu	Kadın"></textarea>
  <label class="f" style="margin-top:10px">Cinsiyeti yazılmamış olanlar<select id="pG"><option value="E">Erkek</option><option value="K">Kadın</option></select></label>
  <div class="acts"><button class="btn" data-x>Vazgeç</button><button class="btn pri" id="pOk">Listeye ekle</button></div>`);
  if(G().length===1)$('#pG').value=G()[0];
  $('#modal [data-x]').onclick=closeModal;
  $('#pOk').onclick=()=>{
    const lines=$('#pT').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let n=0,dup=0;
    for(const l of lines){
      let p=l.split('\t').map(x=>x.trim());if(p.length===1&&l.includes(';'))p=l.split(';').map(x=>x.trim());
      if(/^\d+$/.test(p[0]))p.shift();
      if(p.some(x=>/ad[ıi] ?soyad/i.test(x)))continue; // başlık satırı
      const ad=p[0];if(!ad)continue;
      if(S.teachers.some(t=>t.ad.toLocaleUpperCase('tr-TR')===ad.toLocaleUpperCase('tr-TR'))){dup++;continue}
      let cins=$('#pG').value,kurum=S.settings.okulAdi;
      for(const x of p.slice(1)){const lx=x.toLocaleLowerCase('tr-TR');
        if(['e','erkek','bay'].includes(lx))cins='E';else if(['k','kadın','kadin','kız','kiz','bayan'].includes(lx))cins='K';else if(x)kurum=x}
      S.teachers.push({id:uid(),ad,kurum,cins,kapali:[0,0,0,0,0,0,0],izin:[]});n++;
    }

function runAuto(mode){
  $('#busy').classList.add('on');

/* Toplu tatil / kapalı gün tanımlama */
const TATIL_ONERI=['Ara tatil','Yarıyıl tatili','Ramazan Bayramı','Kurban Bayramı','Resmî tatil','Yaz tatili','Pansiyon tadilatı'];
function donemler(){ // eğitim yılındaki işaretli günleri ardışık aralıklara topla
  const ds=[];for(const mk of eyMonths(S.current)){const M=S.months[mk];if(!M||!M.gun)continue;for(const d in M.gun)if(M.gun[d])ds.push(d)}
  ds.sort();const r=[];
  for(const d of ds){const tur=gunDur(d),ac=gunAc(d);const l=r[r.length-1];
    if(l&&addDays(l.bit,1)===d&&l.tur===tur&&l.ac===ac)l.bit=d;else r.push({bas:d,bit:d,tur,ac})}
  return r;
}
function setRange(bas,bit,tur,ac,clr){
  let n=0,c=0;
  for(let d=bas;d<=bit;d=addDays(d,1)){const M=month(d.slice(0,7));n++;
    if(tur){M.gun[d]=tur;if(ac)M.gunAc[d]=ac;else delete M.gunAc[d];
      if(tur==='kapali'&&clr&&M.cells[d]){for(const g in M.cells[d])M.cells[d][g].forEach(x=>{if(x.t)c++});delete M.cells[d]}}
    else{delete M.gun[d];delete M.gunAc[d]}}
  save();return {n,c};
}

function exportXlsx(html,name,land,sheetName){

/* ================== Yedek / Yardım / Örnek ================== */
$('#bYedek').onclick=()=>{const d=new Date();download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),`Pansiyon_Nobet_Yedek_${fromDate(d)}.json`);toast('Yedek dosyası indirildi')};
$('#bYukle').onclick=()=>$('#fYedek').click();
$('#fYedek').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  try{const o=JSON.parse(r.result);if(!o||typeof o.settings!=='object'||!Array.isArray(o.teachers))throw 0;
    ask('Yedeği yükle','Şu anki bilgilerin yerine yedekteki bilgiler gelecek. Devam edilsin mi?','Yükle',()=>{S=merge(o);save();go(S.view||'okul');toast('Yedek yüklendi')})}
  catch(x){toast('Bu dosya geçerli bir yedek dosyası değil.')}
  e.target.value=''};r.readAsText(f)};
$('#bYardim').onclick=()=>{modal(`<h3>Nasıl kullanılır?</h3>
  <p style="color:var(--ink)"><b>1. Okul bilgileri:</b> Okul adını, pansiyon türünü ve her gece kaç belletici görev alacağını seçin.<br><br>
  <b>2. Belleticiler:</b> Öğretmenleri ekleyin. Nöbet istemedikleri günlere tıklayın; izinli tarihleri girin. Hamilelik, süt izni gibi durumlar için <b>Muafiyet</b> düğmesini kullanın.<br><br>
  <b>3. Nöbet listesi:</b> Ayı seçin, <b>Listeyi otomatik oluştur</b> düğmesine basın. Değiştirmek istediğiniz kişiyi kutudan seçin. Saat düğmesine (8 s / 4 s) tıklayarak görev türünü değiştirin. Pansiyonun kapalı olduğu günleri “Durum” sütunundan, ara tatil ve bayram gibi uzun dönemleri <b>Toplu tatil / kapalı gün</b> düğmesinden işaretleyin.<br><br>
  <b>4. Ek ders puantajı:</b> Saatler otomatik hesaplanır; yazdırın ya da Excel'e aktarın.<br><br>
  <b>5. Yıllık özet:</b> Aylık nöbet sayıları kendiliğinden toplanır.<br><br>
  Bilgiler tarayıcıda otomatik saklanır. Güvenlik için ara sıra <b>Yedek al</b> düğmesini kullanın.</p>
  <div class="acts"><button class="btn pri" data-x>Anladım</button></div>`);$('#modal [data-x]').onclick=closeModal};
function loadDemo(){
  const e=['Ahmet YILMAZ','Mehmet KAYA','Mustafa DEMİR','Ali ÇELİK','Hüseyin ŞAHİN','Hasan YILDIZ','İbrahim AYDIN','Yusuf ÖZTÜRK','Murat ARSLAN','Emre DOĞAN','Burak KILIÇ','Serkan ASLAN'];
  const k=['Ayşe KOÇ','Fatma KURT','Zeynep ÖZDEMİR','Elif ŞİMŞEK','Merve POLAT','Emine ERDOĞAN','Hatice AKSOY','Büşra TEKİN','Esra ÇETİN','Sevgi KARA','Derya YAVUZ','Gül AKTAŞ'];
  const own=S.settings.okulAdi||'Yatılı Bölge Ortaokulu';if(!S.settings.okulAdi)S.settings.okulAdi=own;
  const mk=(ad,c,i)=>({id:uid(),ad,kurum:i%5===4?'Atatürk Ortaokulu':own,cins:c,kapali:[0,0,0,0,0,0,0].map((_,j)=>(i*3+j)%11===0?1:0),izin:[]});
  S.teachers=[...e.map((a,i)=>mk(a,'E',i)),...k.map((a,i)=>mk(a,'K',i+1))];
  save();toast('Örnek veriler yüklendi');go('bel');
}

/* ================== Başlat ================== */
const THEME_KEY='pansiyonNobetTema';
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
try{applyTheme(localStorage.getItem(THEME_KEY))}catch(e){}
$('#bTema').onclick=()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';applyTheme(nx);try{localStorage.setItem(THEME_KEY,nx)}catch(e){}
  toast(nx==='dark'?'Koyu tema':'Açık tema')};
go(VIEWS.includes(S.view)?S.view:'okul');
</script>
