name: z2panel

on:
  push:
    paths: ['keenetic-zapret2-panel/**', '.github/workflows/z2panel.yml']
  pull_request:
    paths: ['keenetic-zapret2-panel/**', '.github/workflows/z2panel.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keenetic-zapret2-panel
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - name: ShellCheck
        run: shellcheck -s sh -S warning install.sh uninstall.sh src/www/api.cgi src/share/z2panel.sh tests/*.sh
      - name: JS syntax
        run: node --check src/www/app.js
      - name: API tests
        run: sh tests/run-tests.sh
