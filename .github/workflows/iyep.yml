name: iyep

on:
  push:
    paths: ['iyep-yonetim-sistemi/**', '.github/workflows/iyep.yml']
  pull_request:
    paths: ['iyep-yonetim-sistemi/**', '.github/workflows/iyep.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iyep-yonetim-sistemi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax
        run: for f in src/js/*.js tools/build.mjs tests/smoke.cjs; do node --check "$f"; done
      - name: Build output up to date
        run: node tools/build.mjs --check
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: node tests/smoke.cjs
